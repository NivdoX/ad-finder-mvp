{% extends "layout.html" %}
{% block title %}Forgot password · RunningAds{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Forgot password</h1>
    <p class="muted">Enter your email and we’ll send you a reset link.</p>

    {% if message %}
        <div class="success-box">{{ message }}</div>
    {% endif %}

    <form method="post" class="stack">
        <input class="form-input" type="email" name="email" placeholder="Email" required>
        <button class="form-button" type="submit">Send reset link</button>
    </form>

    <p class="muted" style="margin-top:16px;">
        Remember your password?
        <a class="text-link" href="{{ url_for('login') }}">Log in</a>
    </p>
</div>
{% endblock %}
