{% extends "layout.html" %}
{% block title %}Log in · RunningAds{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Log in</h1>
    <p class="muted">Use your account to access your saved plan and search limits.</p>

    {% if error %}
        <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="post" class="stack">
        <input type="hidden" name="next" value="{{ next_url }}">
        <input class="form-input" type="email" name="email" placeholder="Email" required>
        <input class="form-input" type="password" name="password" placeholder="Password" required>
        <button class="form-button" type="submit">Log in</button>
    </form>

    <p class="muted" style="margin-top:16px;">
    Need an account?
    <a class="text-link" href="{{ url_for('register', next=next_url) }}">Create one</a>
</p>
</div>
{% endblock %}
