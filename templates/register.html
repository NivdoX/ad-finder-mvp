{% extends "layout.html" %}
{% block title %}Create account · RunningAds{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Create account</h1>
    <p class="muted">Create your account first, then choose a plan and unlock more searches.</p>

    {% if error %}
        <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="post" class="stack">
        <input type="hidden" name="next" value="{{ next_url }}">
        <input class="form-input" type="email" name="email" placeholder="Email" required>
        <input class="form-input" type="password" name="password" placeholder="Password, minimum 8 characters" required>
        <input class="form-input" type="password" name="confirm_password" placeholder="Confirm password" required>
        <button class="form-button" type="submit">Create account</button>
    </form>

    <p class="muted" style="margin-top:16px;">
        Already have an account?
        <a href="{{ url_for('login', next=next_url) }}">Log in</a>
    </p>
</div>
{% endblock %}
