{% extends "layout.html" %}

{% block title %}Reset password · RunningAds{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Reset password</h1>

    <p class="muted">
        Enter your new password below.
    </p>

    {% if error %}
        <div class="error-box">{{ error }}</div>
    {% endif %}

    {% if message %}
        <div class="success-box">{{ message }}</div>
    {% endif %}

    <form method="post" class="stack">
        <input
            class="form-input"
            type="password"
            name="password"
            placeholder="New password"
            required
        >

        <input
            class="form-input"
            type="password"
            name="confirm_password"
            placeholder="Confirm new password"
            required
        >

        <button class="form-button" type="submit">
            Reset password
        </button>
    </form>

    <p class="muted" style="margin-top:16px;">
        Remember your password?
        <a class="text-link" href="{{ url_for('login') }}">Log in</a>
    </p>
</div>
{% endblock %}
